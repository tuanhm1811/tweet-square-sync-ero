# ============================================================
#  .github/workflows/sync.yml
#
#  TAI SAO CHI CON 1 CRON/GIO:
#  Cron cu la '12,42 * * * *' (48 run/ngay) nhung GitHub bo gan het:
#  24-26/08 chi chay ~18-28 run/ngay, den 27/08 con 3 run/ngay, 28/08 la 0.
#  Scheduled workflow la best-effort va bi throttle theo tan suat. Nen: chi
#  xin 1 trigger/gio (GitHub gan nhu luon cho chay), roi giu do min 15 phut
#  bang vong lap sleep BEN TRONG job.
#  Repo da doi sang PUBLIC => Actions minutes mien phi khong gioi han.
#
#  Cron ':11' + vong lap 15 phut => chay o :11 :26 :41 :56, lech 8 phut so
#  voi repo tweet-square-sync (:03 :18 :33 :48) de khong doc X cung luc
#  (hai repo dung chung 1 bo X API credentials).
# ============================================================
name: Tweet to Binance Square (ero)

on:
  schedule:
    - cron: '11 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tweet-sync-ero
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      # >>> Danh sach @username X, ngan cach bang dau phay (bo dau @). <<<
      TWITTER_USERNAMES: "ero_crypto"
      # Muon chay thu ma KHONG dang len Square: doi thanh "1"
      DRY_RUN: "0"
      # 4 vong x 15 phut = phu kin 1 gio.
      ITERATIONS: "4"
      SLEEP_SECONDS: "900"
      # Truoc day de mac dinh 10. Neu lich bi bo nhieu gio va account tweet
      # hon 10 bai, X tra ve 10 bai MOI NHAT roi last_id nhay thang len do
      # => so bai o giua bi mat vinh vien. 100 la tran cua X API v2.
      MAX_RESULTS: "100"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Cai thu vien
        run: pip install requests requests-oauthlib

      - name: Dong bo tweet -> Binance Square (lap trong 1 gio)
        env:
          TWITTER_API_KEY:            ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_SECRET:         ${{ secrets.TWITTER_API_SECRET }}
          TWITTER_ACCESS_TOKEN:       ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_SECRET:      ${{ secrets.TWITTER_ACCESS_SECRET }}
          BINANCE_SQUARE_OPENAPI_KEY: ${{ secrets.BINANCE_SQUARE_OPENAPI_KEY }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          for i in $(seq 1 "$ITERATIONS"); do
            echo "::group::Vong $i/$ITERATIONS - $(date -u '+%Y-%m-%dT%H:%M:%SZ')"

            # Mot vong loi KHONG duoc lam chet ca job: cac vong sau van phai chay.
            python tweet_to_square_ci.py || echo "[!] Vong $i loi, se thu lai o vong sau."

            if [[ -n "$(git status --porcelain state/)" ]]; then
              git add state/
              git commit -q -m "update last ids [skip ci]"
            fi

            # Push ca commit cua vong truoc neu lan do push that bai.
            if [[ -n "$(git log --oneline origin/main..HEAD)" ]]; then
              git pull --rebase -q origin main || true
              git push -q && echo "Da luu state." || echo "[!] Push loi, thu lai vong sau."
            else
              echo "Khong co thay doi state."
            fi

            echo "::endgroup::"

            if [[ "$i" -lt "$ITERATIONS" ]]; then sleep "$SLEEP_SECONDS"; fi
          done
